name: Restore Unread to Inbox (both inboxes)

# Manual only. Moves every unread message that's sitting in a folder/label
# (outside the inbox) back into the inbox, for burke.ruder@ and atxruders@.
# Labels stay on as tags; nothing is deleted or marked read.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would move (1) or actually move it (0)"
        default: "1"

jobs:
  restore:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: [personal, atxruders]
    defaults:
      run:
        working-directory: personal-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: personal-agents/requirements.txt
      - run: pip install -r requirements.txt
      - name: Write credentials to disk
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_PERSONAL }}' > gmail_credentials_personal.json
          echo '${{ secrets.GMAIL_TOKEN_PERSONAL }}' > gmail_token_personal.json
          echo '${{ secrets.GMAIL_TOKEN_ATXRUDERS }}' > gmail_token_atxruders.json
      - name: Restore unread messages to the inbox
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ACCOUNT: ${{ matrix.account }}
        run: python restore_unread.py
