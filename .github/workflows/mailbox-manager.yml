name: Mailbox Manager

on:
  schedule:
    - cron: '0 13 * * *'   # 1 PM UTC = 8 AM CT
  workflow_dispatch:

jobs:
  mailbox-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interesting-group-agents
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: interesting-group-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to disk
        run: |
          cat > .env << 'EOF'
          APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
          INSTANTLY_API_KEY=${{ secrets.INSTANTLY_API_KEY }}
          HUBSPOT_API_KEY=${{ secrets.HUBSPOT_API_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_CLAUDE_READ=${{ secrets.CLOUDFLARE_CLAUDE_READ }}
          CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EOF
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > gmail_credentials.json
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json

      - name: Run mailbox manager
        run: python mailbox_manager.py
