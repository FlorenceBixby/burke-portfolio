name: Ironman Training Calendar Sync

on:
  schedule:
    # Hourly, ~7am-10pm CT (CDT): picks up the morning coaching session, then
    # moves the event whenever Bela schedules or reschedules it.
    - cron: '15 0-3,12-23 * * *'
  workflow_dispatch:

jobs:
  training-calendar-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-agents

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: personal-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to disk
        run: |
          echo '${{ secrets.GMAIL_CREDENTIALS_PERSONAL }}' > gmail_credentials_personal.json
          echo '${{ secrets.GMAIL_TOKEN_PERSONAL }}' > gmail_token_personal.json

      - name: Sync today's training session to the primary calendar
        run: python training_calendar_sync.py

      - name: Report to Burke's Chief of Staff
        if: always()
        env:
          COS_SECRET: ${{ secrets.COS_ESCALATION_SECRET }}
        run: |
          [ -n "$COS_SECRET" ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -o /dev/null -X POST https://chief-of-staff.burke-ruder.workers.dev/heartbeat -H "X-Escalation-Secret: $COS_SECRET" -H "Content-Type: application/json" -d '{"agent":"sailing_master","status":"ok","summary":"run succeeded"}'
          else
            curl -s -o /dev/null -X POST https://chief-of-staff.burke-ruder.workers.dev/escalate -H "X-Escalation-Secret: $COS_SECRET" -H "Content-Type: application/json" -d '{"agent":"sailing_master","message":"GitHub Actions run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
