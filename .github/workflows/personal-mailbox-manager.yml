name: Personal Mailbox Manager

on:
  schedule:
    - cron: '0 12 * * *'   # 12 PM UTC = 7 AM CT (CDT; adjust if daylight saving matters)
  workflow_dispatch:

jobs:
  personal-mailbox-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-agents

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: personal-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to disk
        run: |
          cat > .env << 'EOF'
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL=https://gateway.ai.cloudflare.com/v1/39c192c934290776b0b406805133fa4b/personal-mailbox/anthropic
          FAMILY_CALENDAR_ID=${{ secrets.FAMILY_CALENDAR_ID }}
          EOF
          echo '${{ secrets.GMAIL_CREDENTIALS_PERSONAL }}' > gmail_credentials_personal.json
          echo '${{ secrets.GMAIL_TOKEN_PERSONAL }}' > gmail_token_personal.json

      - name: Run personal mailbox manager
        run: python personal_mailbox_manager.py

      - name: Report to Burke's Chief of Staff
        if: always()
        env:
          COS_SECRET: ${{ secrets.COS_ESCALATION_SECRET }}
        run: |
          [ -n "$COS_SECRET" ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then
            curl -s -o /dev/null -X POST https://chief-of-staff.burke-ruder.workers.dev/heartbeat -H "X-Escalation-Secret: $COS_SECRET" -H "Content-Type: application/json" -d '{"agent":"inbox_custodian","status":"ok","summary":"run succeeded"}'
          else
            curl -s -o /dev/null -X POST https://chief-of-staff.burke-ruder.workers.dev/escalate -H "X-Escalation-Secret: $COS_SECRET" -H "Content-Type: application/json" -d '{"agent":"inbox_custodian","message":"GitHub Actions run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
