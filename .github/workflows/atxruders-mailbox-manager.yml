name: atxruders Mailbox Manager

on:
  schedule:
    - cron: '0 12 * * *'   # 12 PM UTC = 7 AM CT (CDT; adjust if daylight saving matters)
  workflow_dispatch:

jobs:
  atxruders-mailbox-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interesting-group-agents

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: interesting-group-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to disk
        run: |
          cat > .env << 'EOF'
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          FAMILY_CALENDAR_ID=${{ secrets.FAMILY_CALENDAR_ID }}
          EOF
          echo '${{ secrets.GMAIL_CREDENTIALS_PERSONAL }}' > gmail_credentials_personal.json
          echo '${{ secrets.GMAIL_TOKEN_ATXRUDERS }}' > gmail_token_atxruders.json
          echo '${{ secrets.GMAIL_TOKEN_PERSONAL }}' > gmail_token_personal.json

      - name: Run atxruders mailbox manager
        run: python atxruders_mailbox_manager.py
