<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer lens barrel -->
  <circle cx="32" cy="32" r="31" fill="#1a1a1a" stroke="#333" stroke-width="1"/>

  <!-- Canon L red ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#CC0000" stroke-width="4"/>

  <!-- Inner barrel ring -->
  <circle cx="32" cy="32" r="22" fill="#111" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Lens glass -->
  <circle cx="32" cy="32" r="19" fill="#0d1520"/>

  <!-- Glass coating shimmer rings -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(100,140,200,0.15)" stroke-width="1"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="rgba(100,140,200,0.1)" stroke-width="1"/>

  <!-- Glass reflection highlight -->
  <ellipse cx="26" cy="26" rx="6" ry="4" fill="rgba(180,210,255,0.12)" transform="rotate(-30 26 26)"/>
  <ellipse cx="24" cy="25" rx="2.5" ry="1.5" fill="rgba(255,255,255,0.18)" transform="rotate(-30 24 25)"/>

  <!-- Center element -->
  <circle cx="32" cy="32" r="5" fill="#080d14"/>
  <circle cx="32" cy="32" r="3" fill="#0a1018" stroke="rgba(100,140,200,0.2)" stroke-width="0.5"/>
</svg>
