name: Daily Recap

on:
  schedule:
    - cron: '0 0 * * *'   # Midnight UTC = 7 PM CT
  workflow_dispatch:

jobs:
  daily-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secrets to disk
        run: |
          cat > .env << 'EOF'
          APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
          INSTANTLY_API_KEY=${{ secrets.INSTANTLY_API_KEY }}
          HUBSPOT_API_KEY=${{ secrets.HUBSPOT_API_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          EOF
          echo '${{ secrets.GMAIL_CREDENTIALS }}' > gmail_credentials.json
          echo '${{ secrets.GMAIL_TOKEN }}' > gmail_token.json

      - name: Run daily recap
        run: python autonomous_pipeline.py recap
